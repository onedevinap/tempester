<div id="fake-banner" class="banner" hidden>Fake MIDI: a scripted machine in memory. Nothing reaches a real MIDI port, files go to a separate "fake-midi" folder.</div>
<main id="pages"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm" aria-labelledby="confirm-title">

    <h2 id="confirm-title"></h2>
    <div id="confirm-body"></div>
    <div class="buttons">
      <button value="cancel" id="confirm-cancel" class="btn">Cancel</button>
      <button value="ok" id="confirm-ok" class="btn primary">OK</button>
    </div>
  </form>
</dialog>
