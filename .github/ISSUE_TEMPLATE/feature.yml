name: Feature request
description: An idea for the app or for the firmware.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [App, Firmware, Documentation, Tools]
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The musical or practical need first, then the idea of a solution if you have one.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Forum threads, how you work around it today, other instruments that do it.
  - type: checkboxes
    id: content
    attributes:
      label: Content
      options:
        - label: This request contains no DSI file, firmware dump or manual page, and no personal data.
          required: true
