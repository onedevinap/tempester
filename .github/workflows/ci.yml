# Checks of the Tempester app on the three systems (Linux: Ubuntu 24.04 and 26.04), and of the repository's content. No secret, read-only token.
#
# No DSI file is ever in this repository or on the runners: the tests that need the official OS files (marked
# #[ignore] in Rust, and tools/verify.sh) stay skipped here. tools/test_app.sh runs them only when given a folder,
# which CI never does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: no DSI content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No DSI file types in the tree
        run: |
          bad=$(git ls-files | grep -Ei '\.(syx|bin|hex|pdf|mid|wav|aiff?)$' || true)
          [ -z "$bad" ] || { echo "files that are never published: $bad"; exit 1; }
      # The byte-level guard (tools/dsi_content_guard.py) compares the tree with the official DSI images, which CI
      # does not have: contributors run it locally with their own files (pull request checklist).
      - name: No patch in the old format (origin bytes)
        run: |
          bad=$(grep -l '"origine"\|"origin"' patch/*.json || true)
          [ -z "$bad" ] || { echo "patches that still carry origin bytes: $bad"; exit 1; }

  python:
    name: Python tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools compile, tests pass (standard library only)
        run: |
          for f in tools/*.py tools/icons/*.py; do python3 -I -m py_compile "$f"; done
          for t in tests/test_*.py; do python3 -I "$t"; done

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    steps:
      # Generated tables are compared byte for byte: no CRLF conversion on Windows.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # One list per Ubuntu release, so a new runner image is checked by hand first; the -dev names are the same on
      # 24.04 and 26.04. No dpkg-dev here: only the release computes package dependencies (dpkg-shlibdeps).
      - name: Linux libraries (WebKitGTK, GTK, ALSA)
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          case "$VERSION_ID" in
            24.04|26.04) packages="libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev" ;;
            *) echo "no library list for Ubuntu $VERSION_ID"; exit 1 ;;
          esac
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $packages

      - name: Rust toolchain
        # The version pinned in app/rust-toolchain.toml, with its components.
        working-directory: app
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          # Per runner image: the two Ubuntu releases never share a target folder (different glibc and libraries).
          key: cargo-${{ matrix.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      # Generated tables, fmt, clippy -D warnings, tests (disposable HOME / APPDATA), page scripts and UI tests on node.
      - name: tools/test_app.sh
        shell: bash
        run: tools/test_app.sh

  # Tempester Control: CLAP and VST3 bundles with nih-plug, then the headless CLAP host (macOS and Linux). The crate is
  # its own workspace; no GUI framework is linked, so Linux needs no extra system library.
  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: app/crates/tempester-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        working-directory: app
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/crates/tempester-plugin/target
          key: cargo-plugin-${{ matrix.os }}-${{ hashFiles('app/crates/tempester-plugin/Cargo.lock') }}
          restore-keys: cargo-plugin-${{ matrix.os }}-

      - name: Bundles (.clap and .vst3)
        run: cargo xtask bundle tempester-plugin --release

      - name: Headless CLAP host
        if: runner.os != 'Windows'
        run: |
          clap=$(ls -d target/bundled/*.clap | head -n 1)
          cargo run --release --example host_clap -- "$clap"
